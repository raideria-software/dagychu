pipeline_name: demo_math_fork_join_v1
pipeline_tags: [demo, math, fork_join, aggregation]
_meta:
  launch_order_mode: declaration
jobs:
  - job_name: job1_square
    ui_name: Job 1 (Square)
    path: runtime_seed/jobs/job1_square/latest/main.py
    deps: []
    outputs: [result]
    inputs:
      number: initial

  - job_name: job2_mirror_add
    ui_name: Job 2 (Mirror Add)
    path: runtime_seed/jobs/job2_mirror_add/latest/main.py
    deps: [job1_square]
    outputs: [result]
    inputs:
      number:
        job: job1_square
        key: result

  - job_name: job3_digit_mul
    ui_name: Job 3 (Digit Mul)
    path: runtime_seed/jobs/job3_digit_mul/latest/main.py
    deps: [job1_square]
    outputs: [result]
    inputs:
      number:
        job: job1_square
        key: result

  - job_name: job4_sum_to_date
    ui_name: Job 4 (Sum To Date)
    path: runtime_seed/jobs/job4_sum_to_date/latest/main.py
    deps: [job2_mirror_add, job3_digit_mul]
    outputs: [result, date]
    inputs:
      left:
        job: job2_mirror_add
        key: result
      right:
        job: job3_digit_mul
        key: result
