pipeline_name: demo_retry_policy_even_odd
pipeline_tags: [demo, retry, policy, even_odd]
jobs:
  - job_name: even_odd_fixed
    ui_name: Even/Odd demo (fixed retry)
    path: runtime_seed/jobs/job_retry_even_odd/latest/main.py
    deps: []
    outputs: [minute_utc, ok]
    inputs:
      payload: initial
    retry_policy:
      mode: fixed
      max_attempts: 3
      delay_sec: 60

  - job_name: even_odd_exponential
    ui_name: Even/Odd demo (exponential retry)
    path: runtime_seed/jobs/job_retry_even_odd/latest/main.py
    deps: [even_odd_fixed]
    outputs: [minute_utc, ok]
    inputs:
      payload:
        job: even_odd_fixed
        key: minute_utc
    retry_policy:
      mode: exponential
      max_attempts: 4
      delay_sec: 60
      max_delay_sec: 300
