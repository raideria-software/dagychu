pipeline_name: demo_shared_job_payload_merge
pipeline_tags: [demo, merge, shared_job, payload]
jobs:
  - job_name: prepare_payload
    ui_name: Prepare payload
    path: runtime_seed/jobs/demo_etl_pipeline/latest/main.py
    deps: []
    outputs: [records_extracted, records_transformed, total_revenue_usd, avg_order_value, status]
    inputs:
      batch_size:
        merge:
          - from: initial
            key: batch_size
          - from: const
            value: 120
        priority: [initial, const]

  - job_name: shared_sender_email
    ui_name: Shared sender (email profile)
    path: runtime_seed/jobs/demo_daily_report/latest/main.py
    deps: [prepare_payload]
    outputs: [report_date, total_orders, gross_revenue, status]
    inputs:
      gross_revenue:
        merge:
          - from: job
            job: prepare_payload
            key: total_revenue_usd
          - from: const
            value: 84250.0
          - from: initial
            key: custom_revenue
        priority: [job, const, initial]
        deep_merge: false
      total_orders:
        job: prepare_payload
        key: records_transformed

  - job_name: shared_sender_sms
    ui_name: Shared sender (sms profile)
    path: runtime_seed/jobs/demo_daily_report/latest/main.py
    deps: [prepare_payload]
    outputs: [report_date, total_orders, gross_revenue, status]
    inputs:
      gross_revenue:
        merge:
          - from: job
            job: prepare_payload
            key: total_revenue_usd
          - from: const
            value: 42000.0
          - from: initial
            key: custom_revenue
        priority: [job, const, initial]
        deep_merge: false
      total_orders:
        job: prepare_payload
        key: records_transformed
