# =============================================================================
# Dagychu instance configuration (template)
# -----------------------------------------------------------------------------
# Copy to your deployment root (next to .env and docker-compose) as: dagychu-instance.yaml
# (one file per Dagychu installation — NOT inside a pipeline group root).
#
# One file for every edition: the running edition (DAGYCHU_EDITION) decides which capabilities are
# served, so a Community deployment that upgrades to Enterprise gets the full product without
# editing this file.
#
# Per-project runtime: dagychu-config.yaml at each PIPELINE_YAML_DIRS group root.
# Secrets and infrastructure: .env only (DB, RabbitMQ, tokens, host paths, JOB_EXECUTOR, …).
# =============================================================================

# Version 2 = edition-aware monitoring flags. Files still declaring version 1 keep working; their
# monitoring section is treated as legacy and replaced by edition capabilities on upgrade.
dagychu_instance_version: 2

# Interactive first-visit tour (Monitoring). Enterprise capability; ignored in Community.
onboarding:
  enabled: true
  tour:
    file: onboarding-tour.yaml

# Monitoring dashboard tabs + Execution map (V2) APIs.
# Community serves the operational dashboard; Enterprise adds Overview, Execution map, API Security.
monitoring:
  dashboard:
    screens:
      overview: true
      execution_map: true
      operational: false
      report: false
      api_security: true
  v2:
    enabled: true
    ai_enabled: true

# Optional label after product name in the shell (was UI_INSTANCE_NAME).
# Legal documents (Terms, Privacy, Notices) ship in the image — Settings → Legal.
# Optional ui.legal substitutes {{LEGAL_ENTITY}} etc. if those tokens appear in the markdown.
# ui:
#   instance_label: Staging
#   legal:
#     entity: "Acme Ltd"
#     privacy_contact: "privacy@example.com"
#     governing_law: "England and Wales"
#     effective_date: "2026-08-14"
#   branding:
#     hide_product_name: false   # true → logo + compact_letter instead of product name
#     hide_vendor_footer: false  # hide Raideria footer line
#     hide_tagline: false        # hide sidebar tagline under the title
#     compact_letter: "D"
#   nav:
#     screens:                   # false hides a main nav section
#       dashboard: true
#       my_dashboards: true      # Enterprise capability; hidden in Community
#       pipelines: true
#       configuration: true
#       execution: true
#       logs: true
#       system: true
#       scheduler: true
#       guide: true
#       notifications: true
#       admin: true
#       settings: true

# Require connected + validated projects before runs (was PROJECT_EXECUTION_GATE_ENABLED).
# Connect projects in Administration → Projects before the first run.
execution:
  project_execution_gate_enabled: true

# External /ext/* API: async submit/poll + sync run/wait. Secrets stay in .env; policy here.
# Enterprise capability — Community blocks /ext/* regardless of this section.
external_api:
  enabled: true
  allowed_users:
    - agent_client
  rate_limits:
    async:
      per_minute: 120
    sync:
      per_minute: 20
      max_concurrent_waits: 10
  sync:
    default_wait_timeout_sec: 120
    max_wait_timeout_sec: 300
    default_poll_interval_sec: 2
    max_poll_interval_sec: 30
  security:
    retention_days: 7
    login_retention_days: 30

bootstrap:
  # Overview is refreshed in-core by the worker. Do not schedule overview_monitoring_v1 here.
  enabled: false
  wait_api_timeout_sec: 120
  defaults:
    schedule_type: cron
    timezone: UTC
    scheduler_enabled: true
    max_concurrent_runs: 1
  pipelines: []

# --- Typically stay in .env (infrastructure / secrets) ---
# DATABASE_URL, RABBITMQ_*, AUTH_*, UI_ADMIN_TOKEN, WORKER_SERVICE_TOKEN
# PIPELINE_YAML_DIRS, JOB_EXECUTOR, DAGYCHU_BUILD_ROOT, JOB_APP_ROOT, scheduler poll intervals
# EXT_API_* — legacy fallback when external_api is omitted from this file (see external_api above)
