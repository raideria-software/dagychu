# JOB_EXECUTOR=docker overlay (install.sh / update.sh attach this automatically).
#
# Security model:
# - Only service `docker_proxy` mounts the host Engine socket.
# - api / worker / worker_deadline_reserve talk to a filtered TCP proxy (DOCKER_HOST).
# - They never receive /var/run/docker.sock (or the rootless sock) directly.
#
# Stability:
# - Socket path comes from DAGYCHU_DOCKER_SOCK (install/update auto-detect rootless vs rootful).
# - Override in .env if needed: DAGYCHU_DOCKER_SOCK=/run/user/1001/docker.sock
#
# Manual:
#   docker compose -f docker-compose.yml -f docker-compose.docker-sock.yml up -d
#
# Allowlist note: proxy still permits container create/start (required for jobs).
# Dagychu itself must not request privileged / host PID / docker.sock mounts into jobs.

services:
  docker_proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # Read / limited write surface for project image build + job containers.
      CONTAINERS: "1"
      IMAGES: "1"
      BUILD: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      VERSION: "1"
      POST: "1"
      # Deny high-risk Docker API areas (swarm, secrets, exec into arbitrary containers, etc.).
      AUTH: "0"
      SECRETS: "0"
      POST_SECRETS: "0"
      SWARM: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      SESSION: "0"
    volumes:
      - ${DAGYCHU_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    # Proxy listens on 2375 inside the compose network only (not published to the host).

  api:
    environment:
      JOB_EXECUTOR: "${JOB_EXECUTOR:-docker}"
      DOCKER_HOST: tcp://docker_proxy:2375
    depends_on:
      - docker_proxy

  worker:
    environment:
      JOB_EXECUTOR: "${JOB_EXECUTOR:-docker}"
      DOCKER_HOST: tcp://docker_proxy:2375
    depends_on:
      - docker_proxy

  worker_deadline_reserve:
    environment:
      JOB_EXECUTOR: "${JOB_EXECUTOR:-docker}"
      DOCKER_HOST: tcp://docker_proxy:2375
    depends_on:
      - docker_proxy
